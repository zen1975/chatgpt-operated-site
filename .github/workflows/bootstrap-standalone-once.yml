name: Bootstrap standalone OSS candidate once

on:
  push:
    branches: [dev/standalone-baseline-20260907]
    paths:
      - '.github/workflows/bootstrap-standalone-once.yml'

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2

      - name: Generate lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Clean install
        run: npm ci

      - name: Standalone build
        run: npm run build

      - name: Commit generated lockfile to isolated branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'build: add standalone package lock'
          git push origin HEAD:dev/standalone-baseline-20260907
