name: Bootstrap standalone OSS candidate once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-standalone-once.yml'

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2

      - name: Generate lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Clean install
        run: npm ci

      - name: Standalone build
        run: npm run build

      - name: Export generated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: standalone-package-lock
          path: package-lock.json
          if-no-files-found: error
