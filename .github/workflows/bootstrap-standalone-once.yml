name: Bootstrap standalone OSS candidate once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-standalone-once.yml'

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2

      - name: Generate lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Clean install
        run: npm ci

      - name: Standalone build
        run: npm run build

      - name: Replace bootstrap workflow with permanent CI
        run: |
          mkdir -p .github/workflows
          cat > .github/workflows/ci.yml <<'YAML'
          name: CI

          on:
            push:
              branches: [main]
            pull_request:
              branches: [main]

          permissions:
            contents: read

          jobs:
            build:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-node@v4
                  with:
                    node-version: 22.23.2
                    cache: npm
                - run: npm ci
                - run: npm run build
          YAML
          rm -f .github/workflows/bootstrap-standalone-once.yml

      - name: Commit accepted standalone baseline
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'build: establish standalone OSS baseline'
          git push origin HEAD:main

# rerun after standalone Astro config fix
