name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Full history: the migration immutability check below inspects the pull
      # request's base revision, which a shallow clone does not contain.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm

      # The committed lockfile is the install contract for third parties, so CI
      # installs exactly the way a clean clone does.
      - run: npm ci

      - name: Build
        run: npm run build

      # Contract checks are the reason CI exists: a green build only proves the
      # site compiles, not that the shipped schemas, examples, migrations, and
      # configuration still agree with the implementation.
      - name: Contract checks
        run: npm run test:contract

      # The checksum manifest pins migration content inside a distribution, but
      # it cannot enforce immutability on its own: editing an applied migration
      # and regenerating the manifest keeps it consistent. Only the base
      # revision knows what was already released, so pull requests are also
      # checked against it. The base SHA comes from the event -- never a
      # hardcoded branch -- and the check fails closed if it cannot be read.
      - name: Migration immutability (against the pull request base)
        if: github.event_name == 'pull_request'
        run: npm run test:migrations:base -- --base ${{ github.event.pull_request.base.sha }}

  # The documented container flow is a supported entry point for third parties
  # who will not match the pinned Node/npm versions on their host. It broke
  # once already without anyone noticing, so it is exercised here rather than
  # trusted. This also proves the contract checks work with no git metadata:
  # `.dockerignore` excludes `.git` and the base image has no git binary.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: docker build -t chatgpt-operated-site .

      - name: Run the documented verification inside the image
        run: docker run --rm chatgpt-operated-site
